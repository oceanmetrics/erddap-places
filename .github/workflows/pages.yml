# build the browser app and publish it to GitHub Pages at https://oceanmetrics.io/erddap-places/
name: pages

on:
  push:
    branches: [main]
    paths: ['app/**', 'sql/**', '.github/workflows/pages.yml']
    # feedback/<id>.png screenshots (committed by the feedback endpoint) are outside these paths, so they
    # do not redeploy; GitHub rejects `paths` and `paths-ignore` on the same event, so there is no
    # paths-ignore line
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # the live ERDDAP/gazetteer tests skip themselves when the network is unavailable
      - run: npm run test
        # the deploy must not depend on a third-party ERDDAP answering from GitHub's runners
        # (PacIOOS connect-timeouts broke run 37676415329); live fetches run locally only
        env:
          ERDDAP_OFFLINE: '1'
      - run: npm run build
        env:
          VITE_BASE: /erddap-places/   # project site sub-path
          VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }}   # Apps Script /exec; empty = no Send button (docs/feedback.md)
      - run: npm run size-budget       # app/README.md "Size budget"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# refresh the precomputed place statistics (catalog/gazetteer/stats/) and publish the whole gazetteer
# to s3://oceanmetrics.io-public/gazetteer/ = https://storage.oceanmetrics.io/gazetteer/
#
# 2026-10-24: gazetteer/stats/dhw_5km/ is no longer written (nor deleted) from here. It is the one engine's
# (oceanmetrics/indicators requests.yml: om-extract run, the compare gate, and its `daily` job at 09:30 UTC
# for the 18 sanctuaries x dhw_5km CRW_SST and CRW_BAA; ledger om/plans_todo/2026-10-22_om-restructure_gates.md,
# week 1): on 2026-10-23 this job's sync overwrote the engine's files. The per-item upload skips stats/dhw_5km/
# (precompute/src/publish.ts NOT_OURS) and the final sync of stats/ excludes dhw_5km/. The other 18 stats series
# (cmems_*, IMERG_monthly_global_precip, moda_npp_mo_glob, noaa_aoml_seascapes_8day) are still computed only here and
# keep publishing from here until the engine takes them (ledger week 6). A dispatch with sync_dry_run=true runs only
# the publish step, as `aws s3 sync --dryrun`, to show what it would write.
#
# runs on the self-hosted runner `macmini` (labels self-hosted, macOS, ARM64, macmini; see
# catalog/README.md "Where it runs"; msens until 2026-10-12): node, python3, uv and the aws cli come
# from Homebrew on the host, and the S3 sync uses the host's AWS profile (~/.aws). The repository holds no AWS secrets; if the
# two secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are ever added they take precedence.
name: stats

on:
  schedule:
    # daily (weekly until 2026-10-12): while the full-record backfill is incomplete each run continues it
    # (runs stop starting new work after PRECOMPUTE_HOURS); once caught up a run is the newest chunk per item
    - cron: '17 9 * * *'          # 09:17 UTC
  workflow_dispatch:
    inputs:
      dataset:
        description: 'only this ERDDAP dataset (blank = every target)'
        required: false
        default: ''
      publish:
        description: 'sync to S3 when done'
        type: boolean
        required: false
        default: true
      sync_dry_run:
        description: 'skip the precompute and run the publish step as aws s3 sync --dryrun (writes nothing)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: stats
  cancel-in-progress: false       # never interrupt a run mid-download: ERDDAP is a shared resource

jobs:
  stats:
    runs-on: [self-hosted, macmini]
    # the full-record backfill is days of light requests (2026-10-12: from 1985 for CRW, ~100k values per
    # request). The precompute stops starting new work after PRECOMPUTE_HOURS, publishes every item as it
    # finishes, and keeps every aggregated chunk in PRECOMPUTE_CHUNKS, so the next run resumes; the 24 h
    # timeout is only a backstop
    timeout-minutes: 1440
    env:
      AWS_DEFAULT_REGION: us-east-1
      # outside the checkout: actions/checkout cleans ignored files, and these rows make runs incremental
      PRECOMPUTE_CHUNKS: ${{ github.workspace }}/../precompute-chunks
      PRECOMPUTE_HOURS: 21
    steps:
      - uses: actions/checkout@v4

      # node comes from the host (Homebrew), no actions/setup-node
      - name: host tools
        run: |
          node --version
          python3 --version
          aws --version
          free -g 2>/dev/null || vm_stat | head -5
      - run: npm ci
        working-directory: precompute
      # the precompute tests import the app's TypeScript (extent, gazetteer), and esbuild resolves
      # those files against app/tsconfig.app.json, which extends @tsconfig/svelte: the app's
      # dependencies must be installed too, or vitest fails with TSCONFIG_ERROR before any test runs
      - run: npm ci
        working-directory: app
      - name: unit tests (window, chunking, naming, STAC shape)
        run: npm test
        working-directory: precompute

      # rashid as a uv tool (Homebrew's python3 refuses `pip install --user`); pip where there is no uv
      - name: install rashid
        run: |
          if command -v uv >/dev/null; then
            uv tool install --upgrade --quiet rashid
            uv tool dir --bin >> "$GITHUB_PATH"
          else
            python3 -m pip install --user --upgrade --quiet rashid
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      # the published Items, so the collection.json uploaded after each item lists every item on S3, not
      # only the ones this run has redone so far (the checkout holds just the committed ones)
      - name: fetch the published stats Items
        run: |
          aws s3 sync s3://oceanmetrics.io-public/gazetteer/stats/items/ catalog/gazetteer/stats/items/ \
            --only-show-errors --exclude '*' --include '*.json'
          ls catalog/gazetteer/stats/items | wc -l

      # the long pole: polite griddap requests (<=100k values each, <=2 concurrent per place, one place at
      # a time per server, servers side by side; a failing server rests 10 min to 2 h while the others go
      # on); days for the full-record backfill, then only each target's last chunk
      # a source host that does not answer (timeout, dropped connection or 5xx after the retries: PacIOOS
      # `pae-paha.pacioos.hawaii.edu`, the mirror `erddap.oceanmetrics.io`, coastwatch) is a WARNING, not a
      # red job (precompute/src/outage.ts, run.ts): its units are skipped and keep their last published file,
      # the others are computed and published, and stats/outage.json lists the skipped ones. Only a code or
      # data error (a 4xx, a SQL error, a missing place, a failed upload) makes the precompute exit non-zero;
      # it still runs the later steps, so what was produced is published, and fails the job at the end
      - name: precompute the statistics
        id: precompute
        if: ${{ !inputs.sync_dry_run }}
        continue-on-error: true
        working-directory: precompute
        shell: bash
        env:
          # each finished (dataset, variable, place) is uploaded at once (precompute/src/publish.ts)
          PRECOMPUTE_PUBLISH: ${{ (github.event_name == 'schedule' || inputs.publish) && 's3://oceanmetrics.io-public/gazetteer' || '' }}
          # the live progress log on the host, removed by the last step (precompute/heartbeat.sh)
          PROGRESS_LOG: ${{ github.workspace }}/../stats-progress.log
        # caffeinate: a run is up to PRECOMPUTE_HOURS long; macOS must not idle-sleep under it.
        # the output also goes, each line stamped, to PROGRESS_LOG, with a heartbeat every 5 min (quiet
        # time, counts, whether each ERDDAP server answers): the job log on GitHub can lag by hours
        run: |
          set -o pipefail
          : > "$PROGRESS_LOG"
          ./heartbeat.sh "$PROGRESS_LOG" & hb=$!
          trap 'kill $hb 2>/dev/null' EXIT
          ${{ runner.os == 'macOS' && 'caffeinate -i ' || '' }}npx tsx src/precompute.ts ${{ inputs.dataset && format('--dataset {0}', inputs.dataset) || '' }} 2>&1 \
            | tee >(perl -MPOSIX -ne 'BEGIN { $| = 1 } print strftime("%H:%M:%SZ ", gmtime), $_' >> "$PROGRESS_LOG")

      # the run's outage report (stats/outage.json, written only when a host did not answer): a step summary,
      # one warning annotation per host, and a small artifact. Never fails the job.
      - name: source host outage summary
        if: always()
        working-directory: precompute
        run: npx tsx src/ci.ts outage-summary
      - name: upload the outage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stats-outage
          path: catalog/gazetteer/stats/outage.json
          retention-days: 14
          if-no-files-found: ignore

      # the Items fetched from S3 include those of requested places (NERRS:WEL) and of places since removed
      # (MRGID:8439, PSGID:939) that collection.json does not list; rashid fails PTL-LNK-002 on them (red every
      # day since 2026-10-20). Drop them from the checkout only: S3 keeps them (the sync below has no --delete).
      - name: drop fetched Items the collection does not list
        working-directory: precompute
        run: npx tsx src/ci.ts prune-unlisted

      - name: validate the catalog
        run: rashid check catalog/gazetteer

      - name: what was produced
        run: |
          find catalog/gazetteer/stats -name '*.parquet' | wc -l
          du -sh catalog/gazetteer/stats

      # .portolan/ is local bookkeeping and is never published
      - name: publish to S3
        if: ${{ github.event_name == 'schedule' || inputs.publish || inputs.sync_dry_run }}
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SYNC_DRY_RUN         : ${{ inputs.sync_dry_run && '--dryrun' || '' }}
        run: |
          # no secrets: fall back to the host's AWS profile (the mini's default profile)
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          fi
          aws sts get-caller-identity
          # stats/ is synced WITHOUT --delete (an item that failed this week keeps last week's file) and without dhw_5km/
          # (the engine's since 2026-10-24; see the end of this step).
          # rasters/, climatology/ and series/ (Then vs Now) are built on the Mac mini by
          # catalog/build_then_now.py and uploaded from there; their data files are not in git.
          # the bucket now has a second publisher (oceanmetrics/places): sync per collection dir
          # owned by THIS checkout, --delete scoped inside each, and never touch the root
          # catalog.json / versions.json here (they list the other publisher's collections too;
          # publish-time scripts maintain them)
          for d in catalog/gazetteer/*/; do
            name=$(basename "$d")
            case "$name" in stats|rasters|climatology|series) continue ;; esac
            # h3/ is the place x H3 membership oceanmetrics/places builds from the published parquet: never --delete it
            # the data files of these collections are committed (git main is their source of truth), so this sync
            # republishes them as committed: a collection published from here must be committed before the next run
            aws s3 sync $SYNC_DRY_RUN "$d" "s3://oceanmetrics.io-public/gazetteer/$name/" \
              --delete --exclude '.portolan/*' --exclude 'h3/*'
          done
          # 2026-10-24: gazetteer/stats/dhw_5km/ is the engine's (oceanmetrics/indicators requests.yml, daily at 09:30
          # UTC; ledger om/plans_todo/2026-10-22_om-restructure_gates.md, week 1): never written, never deleted from
          # here. The other stats series still publish from here, as before (no --delete) until the engine takes them.
          # outage.json is this run's report (an artifact), not part of the catalog: never published, never stale on S3
          aws s3 sync $SYNC_DRY_RUN catalog/gazetteer/stats/ s3://oceanmetrics.io-public/gazetteer/stats/ \
            --exclude '.portolan/*' --exclude 'outage.json' --exclude 'dhw_5km/*'

      # place ids contain ':' (MRGID:8439), which upload-artifact rejects in file names: ship a tarball
      - name: pack the statistics
        if: always()
        run: tar czf gazetteer-stats.tgz -C catalog/gazetteer stats
      - name: upload the statistics as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gazetteer-stats
          path: gazetteer-stats.tgz
          retention-days: 14
          if-no-files-found: warn
      - name: fail the job if the precompute reported failures
        if: ${{ steps.precompute.outcome == 'failure' }}
        run: |
          echo "::error::the precompute reported an error (a code or data failure, or a failed upload; see its log); the successful items were published. A source host outage is not one: see the outage summary"
          exit 1
      - name: memory after the run
        if: always()
        run: free -g 2>/dev/null || vm_stat | head -5
      # the job log holds the same lines; the progress log is only for watching a run live
      - name: remove the progress log
        if: always()
        run: rm -f "${{ github.workspace }}/../stats-progress.log"

# refresh the precomputed place statistics (catalog/gazetteer/stats/) and publish the whole gazetteer
# to s3://oceanmetrics.io-public/gazetteer/ = https://storage.oceanmetrics.io/gazetteer/
#
# needs two repo secrets (Settings > Secrets and variables > Actions):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  - an IAM user with s3:PutObject, s3:DeleteObject,
#                                               s3:ListBucket on arn:aws:s3:::oceanmetrics.io-public/*
# without them the precompute and the validation still run; only the sync step is skipped.
name: stats

on:
  schedule:
    - cron: '17 9 * * 1'          # Mondays 09:17 UTC
  workflow_dispatch:
    inputs:
      dataset:
        description: 'only this ERDDAP dataset (blank = every target)'
        required: false
        default: ''
      publish:
        description: 'sync to S3 when done'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: stats
  cancel-in-progress: false       # never interrupt a run mid-download: ERDDAP is a shared resource

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            precompute/package-lock.json
            app/package-lock.json
      - run: npm ci
        working-directory: precompute
      # the precompute tests import the app's TypeScript (extent, gazetteer), and esbuild resolves
      # those files against app/tsconfig.app.json, which extends @tsconfig/svelte: the app's
      # dependencies must be installed too, or vitest fails with TSCONFIG_ERROR before any test runs
      - run: npm ci
        working-directory: app
      - name: unit tests (window, chunking, naming, STAC shape)
        run: npm test
        working-directory: precompute

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rashid

      # the long pole: ~1 h of polite griddap requests (<=2 concurrent, one place at a time)
      # one transient ERDDAP fetch failure (e.g. PacIOOS "fetch failed" after retries on 2026-10-07)
      # must not throw away the other items: keep going, publish what was produced, and fail the
      # job at the end so the red run is still visible
      - name: precompute the statistics
        id: precompute
        continue-on-error: true
        working-directory: precompute
        run: npx tsx src/precompute.ts ${{ inputs.dataset && format('--dataset {0}', inputs.dataset) || '' }}

      - name: validate the catalog
        run: rashid check catalog/gazetteer

      - name: what was produced
        run: |
          find catalog/gazetteer/stats -name '*.parquet' | wc -l
          du -sh catalog/gazetteer/stats

      # .portolan/ is local bookkeeping and is never published
      - name: publish to S3
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are not set; skipping the S3 sync"
            exit 0
          fi
          # stats/ is synced WITHOUT --delete: an item that failed this week keeps last week's file
          aws s3 sync catalog/gazetteer/ s3://oceanmetrics.io-public/gazetteer/ \
            --delete --exclude '.portolan/*' --exclude 'stats/*'
          aws s3 sync catalog/gazetteer/stats/ s3://oceanmetrics.io-public/gazetteer/stats/ \
            --exclude '.portolan/*'

      # place ids contain ':' (MRGID:8439), which upload-artifact rejects in file names: ship a tarball
      - name: pack the statistics
        if: always()
        run: tar czf gazetteer-stats.tgz -C catalog/gazetteer stats
      - name: upload the statistics as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gazetteer-stats
          path: gazetteer-stats.tgz
          retention-days: 14
          if-no-files-found: warn
      - name: fail the job if the precompute reported failures
        if: ${{ steps.precompute.outcome == 'failure' }}
        run: |
          echo "::error::the precompute reported failed items (see its log); the successful items were published"
          exit 1

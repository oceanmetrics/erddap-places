# monthly refresh of the obis-h3 release that the obis-hex app reads:
# sync OBIS open data -> build the H3 store -> export Parquet -> validate -> upload to
# s3://oceanmetrics.io-public/obis-h3/<release>/ -> write obis-h3/latest.json last
#
# the work is data-raw/run_refresh_docker.sh in marinebon/obisindicators, which is already checked out
# on the host at ~/Github/marinebon/obisindicators; this repo is not checked out (nothing here is
# built). Runs on the self-hosted runner `macmini` (see catalog/README.md "Where it runs"; msens until
# 2026-10-12). The wrapper starts a Colima VM (profile obis-h3), runs refresh_obis_h3.sh in its Docker
# image with the data on the external drive (DATA_ROOT, default /Volumes/msens_big/_big/obis), stops the
# VM again, and rsyncs a published store to msens for h3t (only a warning when that fails). The S3
# upload uses the host's ~/.aws, mounted read-only into the container: the repository holds no AWS
# secrets, and credentials in the environment would not reach the container. The first run syncs
# ~93 GB of OBIS snapshot before it builds: see data-raw/README.md
#
# after a published release the last step swaps the h3t tile service on msens to the new store
# (ssh msens from the mini, data-raw/deploy_obis_h3.sh there, which refuses an incomplete store and
# fails unless h3t reports the new file after its restart). First automatic on 2026-11-01; done by hand
# for v20261012
name: obis-h3

on:
  schedule:
    - cron: '17 3 1 * *'          # the 1st of each month, 03:17 UTC
  workflow_dispatch:
    inputs:
      release:
        description: 'release tag vYYYYMMDD (blank = the UTC date of the sync)'
        required: false
        default: ''
      skip_sync:
        description: 'skip the OBIS sync (reuse the snapshot on disk)'
        type: boolean
        required: false
        default: false
      skip_build:
        description: 'skip the store build (reuse the newest obis_h3_global_*.duckdb)'
        type: boolean
        required: false
        default: false
      skip_export:
        description: 'skip the Parquet export (reuse $DATA_ROOT/obis-h3/<release>)'
        type: boolean
        required: false
        default: false
      skip_upload:
        description: 'skip the S3 upload and latest.json'
        type: boolean
        required: false
        default: false
      skip_deploy:
        description: 'leave h3t on msens on its current store'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'print the steps only'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: obis-h3
  cancel-in-progress: false       # never kill a run mid-build: it holds the lock and a half-written store

jobs:
  obis-h3:
    runs-on: [self-hosted, macmini]
    timeout-minutes: 1440         # the first run on the mini (93 GB sync, then the build) is ~12 h
    env:
      AWS_DEFAULT_REGION: us-east-1
      OBIS_BRANCH: main
    steps:
      - name: host tools
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          colima version | head -1
          docker --version
          aws --version
          vm_stat | head -5
          df -h /Volumes/msens_big || echo "::warning::/Volumes/msens_big is not mounted"

      - name: update the obisindicators checkout
        run: |
          OBIS_REPO="$HOME/Github/marinebon/obisindicators"
          echo "OBIS_REPO=$OBIS_REPO" >> "$GITHUB_ENV"
          if ! git -C "$OBIS_REPO" diff --quiet || ! git -C "$OBIS_REPO" diff --cached --quiet; then
            echo "::error::$OBIS_REPO has uncommitted changes; refusing to switch branches"
            exit 1
          fi
          git -C "$OBIS_REPO" fetch origin "$OBIS_BRANCH"
          git -C "$OBIS_REPO" checkout "$OBIS_BRANCH"
          git -C "$OBIS_REPO" pull --ff-only origin "$OBIS_BRANCH"
          git -C "$OBIS_REPO" log --oneline -1
          test -f "$OBIS_REPO/R/export.R" || { echo "::error::R/export.R not on $OBIS_BRANCH"; exit 1; }
          test -x "$OBIS_REPO/data-raw/run_refresh_docker.sh" \
            || { echo "::error::data-raw/run_refresh_docker.sh not on $OBIS_BRANCH"; exit 1; }

      - name: refresh obis-h3
        id: refresh
        env:
          IN_RELEASE    : ${{ inputs.release }}
          IN_SKIP_SYNC  : ${{ inputs.skip_sync }}
          IN_SKIP_BUILD : ${{ inputs.skip_build }}
          IN_SKIP_EXPORT: ${{ inputs.skip_export }}
          IN_SKIP_UPLOAD: ${{ inputs.skip_upload }}
          IN_DRY_RUN    : ${{ inputs.dry_run }}
        run: |
          args=()
          [ "$IN_SKIP_SYNC"   = true ] && args+=(--skip-sync)
          [ "$IN_SKIP_BUILD"  = true ] && args+=(--skip-build)
          [ "$IN_SKIP_EXPORT" = true ] && args+=(--skip-export)
          [ "$IN_SKIP_UPLOAD" = true ] && args+=(--skip-upload)
          [ "$IN_DRY_RUN"     = true ] && args+=(--dry-run)
          [ -n "$IN_RELEASE" ] && args+=(--release "$IN_RELEASE")
          # exit 2 = not enough disk (prune old stores), 3 = another run, 4 = validation failed,
          # 5 = the drive is not mounted or Colima/Docker is missing
          # caffeinate: a run is hours long; macOS must not idle-sleep under it
          caffeinate -i "$OBIS_REPO/data-raw/run_refresh_docker.sh" ${args[@]+"${args[@]}"}

      # h3t on msens serves the store the wrapper just copied there; only after a published release
      # (store= is written then; a dry run or --skip-upload leaves it empty). The copy's size is
      # checked first, because the wrapper's rsync only warns when it fails
      - name: swap h3t on msens to the new store
        if: ${{ steps.refresh.outcome == 'success' && steps.refresh.outputs.store != '' && !inputs.dry_run && !inputs.skip_upload && !inputs.skip_deploy }}
        env:
          STORE: ${{ steps.refresh.outputs.store }}
          MSENS_OBIS_DIR: /share/data/obis
        run: |
          name=$(basename "$STORE")
          remote="$MSENS_OBIS_DIR/$name"
          want=$(stat -f %z "$STORE")
          got=$(ssh -o BatchMode=yes -o ConnectTimeout=30 msens "stat -c %s '$remote'" || echo none)
          if [ "$got" != "$want" ]; then
            echo "::error::$remote on msens is $got bytes, $STORE here is $want: the copy did not complete; h3t keeps its current store"
            exit 1
          fi
          # the deploy checks the store's layers, swaps the symlink, restarts h3t, fails unless
          # /h3t/health reports the new file's mtime, bans Varnish, and prints the rollback
          ssh -o BatchMode=yes -o ConnectTimeout=30 msens \
            "cd /share/github/marinebon/obisindicators && ./data-raw/deploy_obis_h3.sh --skip-sync --skip-build --store '$remote' --yes"

      # the wrapper writes log=, release= and store= (host paths) to $GITHUB_OUTPUT; a dry run (or a
      # failure before the refresh starts) writes no log=, and upload-artifact errors on an empty path
      - name: upload the log as an artifact
        if: always() && steps.refresh.outputs.log != ''
        uses: actions/upload-artifact@v4
        with:
          name: obis-h3-refresh-log
          path: ${{ steps.refresh.outputs.log }}
          retention-days: 30
          if-no-files-found: warn

      - name: disk and memory after the run
        if: always()
        run: |
          df -h /Volumes/msens_big || true
          vm_stat | head -5

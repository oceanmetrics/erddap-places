<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>This app moved</title>
    <!-- the redirect page template of the frozen Ocean Metrics apps (2026-10-23). One file, two copies
         (erddap-places and obis-hex, identical, a checksum test in each); the app is named in config.json
         and its codec is codec.js. Not active until the app's index.html forwards here (docs/redirects.md). -->
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #1b2733; --muted: #566573; --link: #0b5cad; --line: #d5dbe1; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e1620; --fg: #e6edf3; --muted: #9fb0c0; --link: #7cb7ff; --line: #2b3a4a; } }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 36rem; margin: 0 auto; padding: 4rem 16px; }
      h1 { font-size: 1.35rem; margin: 0 0 1rem; }
      p { margin: 0 0 1rem; }
      a { color: var(--link); overflow-wrap: anywhere; }
      .note, .count { color: var(--muted); font-size: 0.9rem; }
      .actions { border-top: 1px solid var(--line); padding-top: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">This app moved</h1>
      <p id="message" role="status" aria-live="polite">Finding the new address…</p>
      <p id="link" hidden><a id="target" href="#"></a></p>
      <p id="note" class="note" hidden></p>
      <p class="actions" id="actions" hidden><span id="count" class="count"></span> <a id="stay" href="../?noredirect=1">Stay here</a></p>
      <noscript><p>This page needs JavaScript to find the new address. <a href="../?noredirect=1">Stay here</a>.</p></noscript>
    </main>
    <script type="module" src="./redirect.js"></script>
  </body>
</html>
